name: Build & Release REX Node

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Linux amd64
        run: |
          cd rex-node
          GOOS=linux GOARCH=amd64 go build -v -o ../dist/rex-node-linux-amd64 .

      - name: Build Linux arm64
        run: |
          cd rex-node
          GOOS=linux GOARCH=arm64 go build -v -o ../dist/rex-node-linux-arm64 .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rex-node-binaries
          path: dist/
