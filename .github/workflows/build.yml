name: Build & Publish Release, Docker, APT, RPM

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Multi-Platform Binaries, DEB & RPM Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Tidy Go Modules
        run: |
          cd rex-node
          go mod tidy

      - name: Build Linux amd64 & arm64
        run: |
          cd rex-node
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/rex-node-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/rex-node-linux-arm64 .

      - name: Install NFPM (Package Builder for DEB & RPM)
        run: |
          echo 'deb [trusted=yes] https://apt.fury.io/caarlos0/ /' | sudo tee /etc/apt/sources.list.d/caarlos0.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build DEB (apt) and RPM (yum/dnf) Packages
        run: |
          cat > nfpm.yaml << 'EOF'
          name: "rex-node"
          arch: "amd64"
          platform: "linux"
          version: "1.0.0"
          section: "default"
          priority: "extra"
          maintainer: "T4wroot <admin@rexprotocol.dev>"
          description: "REX Protocol daemon for AI Agents"
          vendor: "REX Protocol"
          homepage: "https://github.com/T4wroot/rex"
          license: "MIT"
          contents:
            - src: "dist/rex-node-linux-amd64"
              dst: "/usr/local/bin/rex-node"
              file_info:
                mode: 0755
            - src: "rex-node/config.yaml"
              dst: "/etc/rex/config.yaml"
            - src: "rex-node/allowlist.yaml"
              dst: "/etc/rex/allowlist.yaml"
          EOF
          nfpm package --config nfpm.yaml --target dist/rex-node_1.0.0_amd64.deb
          nfpm package --config nfpm.yaml --target dist/rex-node-1.0.0.x86_64.rpm

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Name for Docker
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/rex-node:latest
            ghcr.io/${{ env.REPO_LOWER }}/rex-node:v1.0.0

      - name: Create Release & Publish APT DEB & YUM RPM Packages
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: REX Release ${{ github.ref_name || 'v1.0.0' }}
          files: |
            dist/rex-node-linux-amd64
            dist/rex-node-linux-arm64
            dist/rex-node_1.0.0_amd64.deb
            dist/rex-node-1.0.0.x86_64.rpm
