name: Build & Publish Release, Docker, APT

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Multi-Platform Binaries & APT Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Tidy Go Modules
        run: |
          cd rex-node
          go mod tidy

      - name: Build Linux amd64 & arm64
        run: |
          cd rex-node
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/rex-node-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/rex-node-linux-arm64 .

      - name: Build Debian (.deb) Package for apt
        run: |
          mkdir -p deb-pkg/usr/local/bin deb-pkg/etc/rex deb-pkg/DEBIAN deb-pkg/etc/systemd/system
          cp dist/rex-node-linux-amd64 deb-pkg/usr/local/bin/rex-node
          cp rex-node/config.yaml deb-pkg/etc/rex/config.yaml
          cp rex-node/allowlist.yaml deb-pkg/etc/rex/allowlist.yaml
          
          cat > deb-pkg/DEBIAN/control << 'EOF'
          Package: rex-node
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: T4wroot <admin@rexprotocol.dev>
          Description: REX (Remote EXecution Protocol) daemon for AI Agents
          EOF

          cat > deb-pkg/etc/systemd/system/rex-node.service << 'EOF'
          [Unit]
          Description=REX Node Daemon
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/rex-node --config /etc/rex/config.yaml
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

          dpkg-deb --build deb-pkg dist/rex-node_1.0.0_amd64.deb

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Name for Docker
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/rex-node:latest
            ghcr.io/${{ env.REPO_LOWER }}/rex-node:v1.0.0

      - name: Create Release & Publish APT Deb
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: REX Release ${{ github.ref_name || 'v1.0.0' }}
          files: |
            dist/rex-node-linux-amd64
            dist/rex-node-linux-arm64
            dist/rex-node_1.0.0_amd64.deb
