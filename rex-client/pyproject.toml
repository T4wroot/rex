[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rex-client"
version = "2.0.0"
description = "Remote EXecution Protocol (RXP/2.0) — Zero-local footprint direct TCP client for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
