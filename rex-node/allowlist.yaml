# REX Node Security Configuration
# Modes:
#   1. "allowlist"  -> Strict mode: Only explicitly listed commands in allowed_commands can run.
#   2. "review"     -> Semi-Autonomous mode: Safe read-only commands run instantly; risky ones flag for review.
#   3. "autonomous" -> Full Autonomous mode: ALL commands run freely EXCEPT explicit destructive bans in denied_commands.

mode: "autonomous"

# Explicit allowed commands (Used primarily when mode: "allowlist" or "review")
allowed_commands:
  - "systemctl restart xray"
  - "systemctl status xray"
  - "docker restart *"
  - "df -h"
  - "free -m"

allowed_paths:
  - /var/log/

# Absolute Deny List (Protected rules — ALWAYS enforced in ALL modes including "autonomous")
denied_commands:
  - "rm -rf /"
  - "rm -rf /boot"
  - "mkfs"
  - "dd if=/dev/zero"
  - "chmod -R 777 /"
